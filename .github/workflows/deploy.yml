name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild to refresh page views from Yandex Metrika (03:00 UTC = 06:00 MSK)
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No npm or Next.js caches: the site builds fast without them, and
      # restoring them used up the account's Actions cache traffic limit
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Fetch page views from Yandex Metrika
        run: npm run fetch-views
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://atrial.org
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_TELEGRAM_PIXEL_ID: ${{ vars.TELEGRAM_PIXEL_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
